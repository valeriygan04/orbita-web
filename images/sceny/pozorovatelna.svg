<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>Noční pozorovatelna s dalekohledy</title>
  <defs>
    <linearGradient id="nebe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03081a"/>
      <stop offset="1" stop-color="#15244d"/>
    </linearGradient>
    <linearGradient id="draha" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c2dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8c2dc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b8c2dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stopa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc857" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe7a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nebe)"/>
  <!-- Mléčná dráha -->
  <path d="M-40 330 C200 200 520 160 840 -20 L840 60 C540 220 240 260 -40 400 Z" fill="url(#draha)"/>
  <g fill="#f2f4fa">
    <circle cx="50" cy="60" r="1.5"/><circle cx="130" cy="30" r="1"/><circle cx="220" cy="110" r="1.2"/><circle cx="300" cy="50" r="1.5"/>
    <circle cx="360" cy="150" r="1"/><circle cx="430" cy="90" r="1.2"/><circle cx="480" cy="190" r="1"/><circle cx="560" cy="70" r="1.5"/>
    <circle cx="610" cy="140" r="1"/><circle cx="690" cy="40" r="1.2"/><circle cx="750" cy="120" r="1.5"/><circle cx="90" cy="180" r="1"/>
    <circle cx="260" cy="230" r="1"/><circle cx="520" cy="250" r="1"/><circle cx="660" cy="210" r="1.2"/><circle cx="170" cy="250" r="1"/>
  </g>
  <!-- meteory Perseid -->
  <g stroke="url(#stopa)" stroke-linecap="round">
    <line x1="330" y1="120" x2="430" y2="60" stroke-width="2.5"/>
    <line x1="560" y1="180" x2="640" y2="128" stroke-width="2"/>
    <line x1="120" y1="120" x2="180" y2="84" stroke-width="1.8"/>
  </g>
  <!-- Měsíc -->
  <circle cx="700" cy="250" r="20" fill="#fff8e1"/>
  <circle cx="710" cy="244" r="18" fill="#03081a" fill-opacity="0.5"/>
  <!-- kopeček a plošina s rampou -->
  <path d="M0 360 Q300 320 520 340 T800 330 V450 H0 Z" fill="#0b1530"/>
  <rect x="300" y="330" width="380" height="16" fill="#7c8bb5"/>
  <path d="M300 346 L180 400 H200 L300 352 Z" fill="#7c8bb5"/>
  <g stroke="#7c8bb5" stroke-width="3">
    <line x1="300" y1="330" x2="300" y2="300"/><line x1="680" y1="330" x2="680" y2="300"/><line x1="300" y1="302" x2="680" y2="302"/>
    <line x1="490" y1="330" x2="490" y2="302"/>
  </g>
  <!-- dalekohledy -->
  <g stroke="#b8c2dc" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M370 330 l-10 -40 M370 330 l10 -40 M370 290 v0"/><line x1="348" y1="300" x2="400" y2="250" stroke-width="10"/>
    <path d="M560 330 l-10 -40 M560 330 l10 -40"/><line x1="540" y1="296" x2="600" y2="256" stroke-width="10"/>
  </g>
  <!-- nízký okulár (pro vozík) -->
  <g stroke="#b8c2dc" stroke-width="4" stroke-linecap="round"><path d="M640 330 l-6 -22 M640 330 l6 -22"/><line x1="626" y1="312" x2="666" y2="286" stroke-width="9"/></g>
  <!-- pozorovatelé -->
  <g fill="#060d22">
    <circle cx="335" cy="296" r="9"/><rect x="325" y="303" width="18" height="27" rx="6"/>
    <circle cx="590" cy="300" r="9"/><rect x="580" y="307" width="18" height="23" rx="6"/>
    <circle cx="620" cy="306" r="8"/><rect x="608" y="312" width="22" height="14" rx="5"/>
    <circle cx="612" cy="326" r="7" fill="none" stroke="#060d22" stroke-width="3"/>
    <!-- ležící na lehátkách -->
    <path d="M60 400 l90 -18 l8 8 l-92 20 Z"/><circle cx="148" cy="378" r="8"/>
    <path d="M210 420 l90 -18 l8 8 l-92 20 Z"/><circle cx="298" cy="398" r="8"/>
  </g>
  <!-- červené orientační světlo -->
  <g fill="#ff5a4f"><circle cx="300" cy="300" r="3"/><circle cx="680" cy="300" r="3"/><circle cx="200" cy="398" r="3"/></g>
</svg>
