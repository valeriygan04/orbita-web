<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>Stan Teorie během debaty</title>
  <defs>
    <linearGradient id="nebe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060d22"/>
      <stop offset="1" stop-color="#15244d"/>
    </linearGradient>
    <linearGradient id="uvnitr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4380"/>
      <stop offset="1" stop-color="#15244d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nebe)"/>
  <g fill="#f2f4fa"><circle cx="60" cy="40" r="1.5"/><circle cx="160" cy="90" r="1"/><circle cx="640" cy="50" r="1.5"/><circle cx="740" cy="100" r="1"/><circle cx="400" cy="20" r="1"/></g>
  <!-- stan -->
  <path d="M90 360 L190 120 H610 L710 360 Z" fill="#15244d" stroke="#7c8bb5" stroke-width="3"/>
  <path d="M190 120 L400 40 L610 120 Z" fill="#2e4380" stroke="#7c8bb5" stroke-width="3"/>
  <line x1="400" y1="40" x2="400" y2="22" stroke="#7c8bb5" stroke-width="3"/>
  <path d="M400 22 l22 6 l-22 6 Z" fill="#ffc857"/>
  <path d="M150 360 L230 150 H570 L650 360 Z" fill="url(#uvnitr)"/>
  <!-- světelný řetěz -->
  <path d="M190 122 Q295 160 400 124 Q505 160 610 122" fill="none" stroke="#7c8bb5" stroke-width="1.5"/>
  <g fill="#ffc857"><circle cx="225" cy="136" r="4"/><circle cx="265" cy="146" r="4"/><circle cx="305" cy="148" r="4"/><circle cx="345" cy="142" r="4"/><circle cx="455" cy="142" r="4"/><circle cx="495" cy="148" r="4"/><circle cx="535" cy="146" r="4"/><circle cx="575" cy="136" r="4"/></g>
  <!-- obrazovka s oběžnou dráhou -->
  <rect x="320" y="165" width="160" height="90" rx="3" fill="#0b1530" stroke="#f2f4fa" stroke-width="2"/>
  <ellipse cx="400" cy="210" rx="58" ry="22" fill="none" stroke="#5fd3e6" stroke-width="2"/>
  <circle cx="400" cy="210" r="10" fill="#ffc857"/><circle cx="456" cy="204" r="5" fill="#5fd3e6"/>
  <!-- pódium a řečníci -->
  <rect x="250" y="285" width="300" height="22" fill="#7c8bb5"/>
  <g fill="#060d22">
    <circle cx="310" cy="250" r="11"/><path d="M296 285 v-22 a14 14 0 0 1 28 0 v22 Z"/>
    <circle cx="400" cy="250" r="11"/><path d="M386 285 v-22 a14 14 0 0 1 28 0 v22 Z"/>
    <circle cx="490" cy="250" r="11"/><path d="M476 285 v-22 a14 14 0 0 1 28 0 v22 Z"/>
  </g>
  <line x1="420" y1="285" x2="420" y2="258" stroke="#b8c2dc" stroke-width="2"/>
  <!-- zem a publikum -->
  <path d="M0 360 H800 V450 H0 Z" fill="#0b1530"/>
  <g fill="#060d22">
    <g id="r">
      <circle cx="210" cy="340" r="10"/><rect x="198" y="348" width="24" height="24" rx="7"/>
      <circle cx="270" cy="340" r="10"/><rect x="258" y="348" width="24" height="24" rx="7"/>
      <circle cx="330" cy="340" r="10"/><rect x="318" y="348" width="24" height="24" rx="7"/>
      <circle cx="390" cy="340" r="10"/><rect x="378" y="348" width="24" height="24" rx="7"/>
      <circle cx="450" cy="340" r="10"/><rect x="438" y="348" width="24" height="24" rx="7"/>
      <circle cx="510" cy="340" r="10"/><rect x="498" y="348" width="24" height="24" rx="7"/>
      <circle cx="570" cy="340" r="10"/><rect x="558" y="348" width="24" height="24" rx="7"/>
    </g>
    <use href="#r" transform="translate(-30 50)"/>
  </g>
  <!-- ruka s mikrofonem z publika -->
  <path d="M478 386 l10 -40" stroke="#060d22" stroke-width="7" stroke-linecap="round"/>
  <rect x="484" y="334" width="7" height="14" rx="3" fill="#b8c2dc"/>
</svg>
