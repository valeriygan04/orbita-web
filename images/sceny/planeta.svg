<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>Sál Planeta – krytý dóm za soumraku</title>
  <defs>
    <linearGradient id="soumrak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="0.6" stop-color="#2e4380"/>
      <stop offset="1" stop-color="#c77d5a"/>
    </linearGradient>
    <radialGradient id="dom" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#3b5aa8"/>
      <stop offset="1" stop-color="#15244d"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#soumrak)"/>
  <g fill="#f2f4fa"><circle cx="70" cy="40" r="1.5"/><circle cx="210" cy="70" r="1"/><circle cx="600" cy="35" r="1.5"/><circle cx="720" cy="80" r="1"/><circle cx="420" cy="30" r="1"/></g>
  <circle cx="690" cy="70" r="18" fill="#f2f4fa" fill-opacity="0.9"/>
  <!-- stromy -->
  <g fill="#060d22">
