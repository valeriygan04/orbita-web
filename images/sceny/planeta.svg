    <path d="M690 370 l28 -100 l28 100 Z"/><path d="M740 370 l22 -70 l22 70 Z"/>
  </g>
  <!-- dóm -->
  <path d="M170 370 C170 160 630 160 630 370 Z" fill="url(#dom)" stroke="#7c8bb5" stroke-width="3"/>
  <g fill="none" stroke="#7c8bb5" stroke-width="1.5" opacity="0.8">
    <path d="M400 218 C330 230 260 300 250 370"/><path d="M400 218 C470 230 540 300 550 370"/>
    <path d="M400 218 V370"/><path d="M200 300 C330 270 470 270 600 300"/>
