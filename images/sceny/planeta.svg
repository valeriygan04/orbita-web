  <path d="M215 330 C330 312 470 312 585 330 L585 344 C470 326 330 326 215 344 Z" fill="#0b1530"/>
  <g fill="#ffc857"><circle cx="260" cy="334" r="1.6"/><circle cx="330" cy="326" r="1.4"/><circle cx="400" cy="323" r="1.8"/><circle cx="470" cy="326" r="1.4"/><circle cx="540" cy="333" r="1.6"/></g>
