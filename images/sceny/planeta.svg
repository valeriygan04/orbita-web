    <circle cx="520" cy="402" r="8"/><rect x="512" y="410" width="16" height="30" rx="6"/>
    <circle cx="330" cy="406" r="8"/><rect x="320" y="414" width="24" height="16" rx="6"/>
    <circle cx="322" cy="434" r="9" fill="none" stroke="#060d22" stroke-width="3"/><circle cx="344" cy="434" r="9" fill="none" stroke="#060d22" stroke-width="3"/>
