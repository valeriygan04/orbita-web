  <path d="M360 370 V318 a40 40 0 0 1 80 0 V370 Z" fill="#ffc857"/>
  <path d="M360 370 L300 400 H520 L440 370 Z" fill="#7c8bb5"/>
  <line x1="300" y1="392" x2="360" y2="362" stroke="#f2f4fa" stroke-width="3"/>
